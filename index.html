    <script>
      if (window.location.hostname.toLowerCase() === "choi-tcm.ch") {
        window.location.replace(
          "https://www.choi-tcm.ch" +
            window.location.pathname +
            window.location.search +
            window.location.hash
        );
      }
    </script>

    <!-- Restore the route encoded by GitHub Pages' 404 fallback before React starts. -->
    <script>
      (function () {
        var search = window.location.search;
        if (search.startsWith("?/") || search.startsWith("?%2F")) {
          var encodedRoute = search.startsWith("?%2F")
            ? decodeURIComponent(search.slice(1))
            : search.slice(1);
          var separator = encodedRoute.indexOf("&");
          var route = separator === -1
            ? encodedRoute
            : encodedRoute.slice(0, separator);
          var query = separator === -1
            ? ""
            : "?" + encodedRoute.slice(separator + 1);

          window.history.replaceState(
            null,
            "",
            window.location.pathname.slice(0, -1) +
              route.replace(/~and~/g, "&") +
              query +
              window.location.hash
          );
        }
      })();
    </script>
